<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <style>
      .title{font:700 42px 'Microsoft YaHei','PingFang SC',Arial;fill:#173d32}.subtitle{font:22px 'Microsoft YaHei','PingFang SC',Arial;fill:#6b7c74}
      .h1{font:700 27px 'Microsoft YaHei','PingFang SC',Arial;fill:#173d32}.h2{font:700 22px 'Microsoft YaHei','PingFang SC',Arial;fill:#173d32}
      .body{font:19px 'Microsoft YaHei','PingFang SC',Arial;fill:#50675d}.small{font:16px 'Microsoft YaHei','PingFang SC',Arial;fill:#6b7d74}
      .tag{font:16px 'Microsoft YaHei','PingFang SC',Arial;fill:#28694d}.phase{font:700 23px 'Microsoft YaHei','PingFang SC',Arial;fill:#214f3c}
      .arrow{stroke:#4b9d77;stroke-width:4;fill:none;marker-end:url(#arrow)}.arrow-dashed{stroke:#8b78bf;stroke-width:4;stroke-dasharray:10 9;fill:none;marker-end:url(#arrowPurple)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4b9d77"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8b78bf"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#214f3c" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="1800" height="1050" fill="#f5f8f6"/>
  <text x="60" y="68" class="title">AgentTo 整体架构（Agent 优先）</text>
  <text x="60" y="104" class="subtitle">先完成文件上下文与智能体底座，再接入工作流；服务边界和接口从第一阶段开始保留。</text>

  <g filter="url(#shadow)">
    <rect x="60" y="140" width="520" height="118" rx="20" fill="#eaf7f0" stroke="#55ae83" stroke-width="2"/>
    <rect x="640" y="140" width="520" height="118" rx="20" fill="#ffffff" stroke="#91aaa0" stroke-width="2" stroke-dasharray="10 8"/>
    <rect x="1220" y="140" width="520" height="118" rx="20" fill="#ffffff" stroke="#91aaa0" stroke-width="2" stroke-dasharray="10 8"/>
  </g>
  <text x="88" y="182" class="phase">阶段 1 · Agent 优先</text>
  <text x="88" y="218" class="body">文件、上下文、Prompt、RAG、模型调用、报告与可视化</text>
  <text x="668" y="182" class="phase">阶段 2 · 工作流接入</text>
  <text x="668" y="218" class="body">重构迁移 HopFresh BPM，接入企微和临时流程 V0</text>
  <text x="1248" y="182" class="phase">阶段 3 · 完整闭环</text>
  <text x="1248" y="218" class="body">A 自审 → C 咨询 → 秘书组终审 → 老板审批 / 驳回</text>

  <rect x="500" y="305" width="800" height="116" rx="22" fill="#ffffff" stroke="#a7bbb2" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="350" class="h1">AgentTo 主前端</text>
  <text x="540" y="385" class="body">文件协同、角色化业务页面、Agent 技术管理与全过程可视化</text>
  <rect x="1012" y="333" width="100" height="34" rx="17" fill="#e8f4ee"/><text x="1033" y="357" class="tag">Vue 3</text>
  <rect x="1125" y="333" width="135" height="34" rx="17" fill="#e8f4ee"/><text x="1145" y="357" class="tag">TypeScript</text>

  <rect x="60" y="500" width="370" height="308" rx="24" fill="#ffffff" stroke="#49a6a1" stroke-width="3" filter="url(#shadow)"/>
  <text x="95" y="548" class="h1">独立 RAG 服务</text>
  <text x="95" y="590" class="body">通用能力：</text>
  <text x="95" y="625" class="small">解析、清洗、分块、Embedding</text>
  <text x="95" y="655" class="small">混合召回、RRF、Rerank、引用</text>
  <text x="95" y="700" class="body">明确边界：</text>
  <text x="95" y="735" class="small">不理解 BPM，不组装最终 Prompt</text>
  <text x="95" y="765" class="small">工作文件不自动进入企业知识库</text>

  <rect x="500" y="470" width="800" height="368" rx="26" fill="#eef9f3" stroke="#42a776" stroke-width="4" filter="url(#shadow)"/>
  <text x="540" y="520" class="h1">agentto-backend · 业务与 Agent 中心</text>
  <text x="540" y="565" class="h2">正式业务数据</text>
  <text x="740" y="565" class="body">文件任务、不可变版本、意见、角色、上下文快照、ContextPackage</text>
  <text x="540" y="610" class="h2">Agent Runtime</text>
  <text x="740" y="610" class="body">Planning → Review → Reflection → Finalize；人工触发且不阻断流程</text>
  <text x="540" y="655" class="h2">动态组装</text>
  <text x="740" y="655" class="body">角色 + 节点 + 当前文件 + 全量历史 + RAG 依据 + Prompt 版本</text>
  <text x="540" y="700" class="h2">稳定接口</text>
  <text x="740" y="700" class="body">RagGateway、WorkflowGateway、ModelProvider、ToolRegistry</text>
  <text x="540" y="745" class="h2">技术底座</text>
  <text x="740" y="745" class="body">Java 21、Spring Boot 4.0.6、Spring AI 2.0、SSE、JPA</text>
  <rect x="540" y="775" width="700" height="42" rx="12" fill="#dff2e8"/>
  <text x="560" y="803" class="small">AgentTo 是文件业务、正式上下文和每次 Agent 运行的事实来源</text>

  <rect x="1370" y="500" width="370" height="308" rx="24" fill="#fbf9ff" stroke="#8b78bf" stroke-width="3" stroke-dasharray="12 9" filter="url(#shadow)"/>
  <text x="1405" y="548" class="h1">workflow-service</text>
  <text x="1405" y="582" class="small">第二阶段接入</text>
  <text x="1405" y="625" class="body">重构迁移 HopFresh BPM</text>
  <text x="1405" y="660" class="small">Flowable 8、模型、实例、任务、历史</text>
  <text x="1405" y="695" class="small">企微通知、可视化流程设计</text>
  <text x="1405" y="745" class="body">第一阶段：</text>
  <text x="1405" y="777" class="small">WorkflowContextProvider 提供模拟上下文</text>

  <path d="M900 421 L900 460" class="arrow"/>
  <path d="M430 650 L485 650" class="arrow"/>
  <path d="M1300 650 L1355 650" class="arrow-dashed"/>
  <text x="731" y="451" class="small">统一业务 API / SSE 进度</text>

  <g filter="url(#shadow)">
    <rect x="60" y="890" width="380" height="105" rx="18" fill="#ffffff" stroke="#cddbd4" stroke-width="2"/>
    <rect x="500" y="890" width="380" height="105" rx="18" fill="#ffffff" stroke="#cddbd4" stroke-width="2"/>
    <rect x="940" y="890" width="380" height="105" rx="18" fill="#ffffff" stroke="#cddbd4" stroke-width="2"/>
    <rect x="1380" y="890" width="360" height="105" rx="18" fill="#fff8ed" stroke="#dfa154" stroke-width="2"/>
  </g>
  <text x="90" y="930" class="h2">MySQL</text><text x="90" y="965" class="small">agentto / rag / workflow 三个逻辑库</text>
  <text x="530" y="930" class="h2">Redis / MinIO / ES</text><text x="530" y="965" class="small">会话短状态、原文件与快照、知识索引</text>
  <text x="970" y="930" class="h2">Nacos</text><text x="970" y="965" class="small">注册发现、运行配置、真实密钥</text>
  <text x="1410" y="930" class="h2">模型 API</text><text x="1410" y="965" class="small">DeepSeek 启用；千问 / GLM 预留</text>
</svg>
