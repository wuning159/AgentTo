name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: rag-service/backend/pom.xml
      - name: Verify (exclude Testcontainers integration)
        run: |
          chmod +x mvnw
          # 集成测试依赖本地镜像 agentto-elasticsearch:9.4.2-ik（含 IK），
          # GitHub-hosted runner 上没有这张镜像，也不在本 job 现编。
          ./mvnw -B -ntp verify -Dsurefire.excludes='**/integration/**'

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rag-service/frontend/package-lock.json
      - name: Install, test, and build
        run: |
          # lockfile 的 resolved 指向 npmmirror；托管 runner 改走 npmjs，避免镜像跨境抖动。
          # 只改工作副本，不回写仓库。
          sed -i 's#https://registry.npmmirror.com#https://registry.npmjs.org#g' package-lock.json
          npm ci
          npm test
          npm run build
