spring:
  datasource:
    url: jdbc:h2:mem:agentto_rag;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

rag:
  auth:
    bootstrap-enabled: false
  client:
    key-pepper: test-pepper-for-unit-tests
  async:
    enabled: false
  storage:
    enabled: false
  elasticsearch:
    enabled: false
  tei:
    embedding-enabled: false
    rerank-enabled: false
